<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laudo assistido — Ultrassonografia musculoesquelética</title>
<style>
:root{
  --canvas:#E7ECE8; --panel:#FFFFFF; --ink:#16211C; --muted:#5E6B63; --soft:#8A958E;
  --rule:#D2DAD5; --rule-strong:#B4C0B8; --green:#3F7A5E; --green-soft:#EAF2ED;
  --slate:#2C4A6B; --slate-soft:#E9EFF5; --amber:#8A6A12; --amber-soft:#F7F1DF;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --doc:Calibri,Carlito,"Segoe UI",Candara,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ───────────── barra superior ───────────── */
.bar{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;padding:12px 22px}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:6px}
.brand b{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.brand span{font-size:11px;color:var(--soft);letter-spacing:.1em;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.field select,.field input{font:inherit;padding:6px 9px;border:1px solid var(--rule-strong);
  border-radius:3px;background:#fff;color:var(--ink);min-width:120px}
.bar .spacer{flex:1}
.act{display:flex;gap:8px}
.btn{padding:9px 16px;border:1px solid var(--rule-strong);background:#fff;border-radius:3px;
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#356A51;color:#fff}

/* ───────────── layout ───────────── */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,720px);gap:22px;
  padding:22px;align-items:start;max-width:1720px;margin:0 auto}
@media(max-width:1180px){.wrap{grid-template-columns:1fr}}

/* ───────────── console ───────────── */
.console{background:var(--panel);border:1px solid var(--rule);border-radius:4px}
.console-head{padding:14px 20px;border-bottom:1px solid var(--rule);display:flex;
  justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.console-head h1{margin:0;font-size:15px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.console-head .hint{font-size:11.5px;color:var(--soft)}
.tally{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.tally b{color:var(--slate)}

.grouphead{padding:14px 20px 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--green);border-top:1px solid var(--rule)}
.grouphead:first-of-type{border-top:0}

.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:11px 20px;
  border-top:1px solid var(--rule);align-items:start}
.row:first-child{border-top:0}
.row.alt{background:#FAFBFA}
.idx{font-family:var(--mono);font-size:12px;color:var(--soft);padding-top:2px;letter-spacing:.04em}
.row.altered .idx{color:var(--slate);font-weight:700}
.row.pending .idx{color:var(--amber);font-weight:700}
.sent{margin:0;font-size:13.5px}
.sent[contenteditable]{border-radius:3px;padding:1px 3px;margin:-1px -3px;transition:background .12s}
.sent[contenteditable]:hover{background:#F2F5F3}
.sent[contenteditable]:focus{background:#F2F5F3;outline:1px solid var(--rule-strong)}
.row.altered .sent.norm{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--rule-strong)}

/* interruptor normal */
.toggle{display:inline-flex;align-items:center;gap:8px;user-select:none;cursor:pointer;white-space:nowrap}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.track{width:40px;height:21px;border-radius:11px;background:#DBE2DD;border:1px solid var(--rule-strong);
  position:relative;transition:background .15s,border-color .15s;flex:none}
.track::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked + .track{background:var(--green);border-color:var(--green)}
.toggle input:checked + .track::after{transform:translateX(19px)}
.toggle input:focus-visible + .track{outline:2px solid var(--green);outline-offset:2px}
.tlabel{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.toggle input:checked ~ .tlabel{color:var(--green)}

/* achados */
.finds{grid-column:2/-1;margin:8px 0 2px;padding:0;list-style:none;border-left:2px solid var(--rule);
  padding-left:14px;display:flex;flex-direction:column;gap:7px}
.finds.locked{opacity:.4}
.gtitle{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--soft);margin-top:3px}
.find{display:flex;gap:9px;align-items:flex-start}
.find input[type=checkbox]{margin:3px 0 0;width:15px;height:15px;accent-color:var(--slate);flex:none}
.find input:disabled{cursor:not-allowed}
.find .txt{font-size:13px;color:var(--muted)}
.find .txt b{color:var(--ink);font-weight:600}
.find.on .txt{color:var(--ink)}
.find.on .txt b{color:var(--slate)}
.locknote{grid-column:2/-1;font-size:11.5px;color:var(--soft);font-style:italic;margin-top:6px}
.peek{grid-column:2/-1;margin-top:6px;background:none;border:0;padding:0;text-align:left;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--soft);text-decoration:underline;text-underline-offset:3px}
.peek:hover{color:var(--green)}
.slots{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:7px 0 2px 24px}
.slab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--soft);margin-right:2px}
.chip{padding:3px 9px;border:1px solid var(--rule-strong);background:#fff;border-radius:11px;
  font-size:11.5px;color:var(--muted);line-height:1.35}
.chip:hover{border-color:var(--slate);color:var(--slate)}
.chip.on{background:var(--slate-soft);border-color:var(--slate);color:var(--slate);font-weight:600}
.chip.uni{border-radius:3px}
.fields{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 2px 24px}
.fld{width:66px;padding:3px 7px;border:1px solid var(--rule-strong);border-radius:3px;
  font:inherit;font-size:11.5px;color:var(--ink);background:#fff}
.fld:focus{border-color:var(--slate);outline:none}
.fld.wide{width:120px}
.funit{font-size:11px;color:var(--soft);margin:0 2px 0 -2px}
.edtxt{width:100%;margin:7px 0 2px 24px;font:inherit;font-size:12.5px;padding:7px 9px;
  border:1px solid var(--rule-strong);border-radius:3px;resize:vertical;min-height:52px}
.dxline{display:flex;gap:9px;font-size:13px;padding:3px 0}
.dxline .b{color:var(--slate);font-family:var(--mono);font-size:11px;padding-top:2px}
.autonote{font-size:11.5px;color:var(--soft);font-style:italic;margin:2px 0 9px}
.warn{grid-column:2/-1;margin-top:7px;font-size:11.5px;color:var(--amber);
  background:var(--amber-soft);border-radius:3px;padding:5px 9px;display:inline-block}
.freebtn{align-self:flex-start;margin-top:2px;background:none;border:0;padding:0;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--green);text-decoration:underline;text-underline-offset:3px}

/* impressão */
.comp{padding:14px 20px 4px;border-top:1px solid var(--rule)}
.comp textarea{width:100%;margin-top:9px;font:inherit;font-size:13px;padding:8px 10px;
  border:1px solid var(--rule-strong);border-radius:3px;min-height:54px;resize:vertical}
.comp .fields{margin-top:6px}
.impr{padding:14px 20px 20px;border-top:1px solid var(--rule)}
.impr textarea{width:100%;margin-top:9px;font:inherit;font-size:13px;padding:8px 10px;
  border:1px solid var(--rule-strong);border-radius:3px;resize:vertical;min-height:56px}

/* ───────────── folha ───────────── */
.paper{position:sticky;top:84px}
.paper-bar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.paper-bar span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--soft)}
.sheet{width:210mm;min-height:297mm;background:#fff;box-shadow:0 2px 16px rgba(20,40,30,.14);
  transform-origin:top left;display:flex;flex-direction:column;
  padding:10mm 16mm;font-family:var(--doc);color:#1A1A1A;position:relative}
.sheet-scale{overflow:hidden}

.sheet-tbl{width:100%;border-collapse:collapse;flex:1;height:100%}
.sheet-tbl td{padding:0;vertical-align:top}
.sheet-tbl tfoot td{vertical-align:bottom}
.sheet-head{text-align:center;position:relative;padding-bottom:2mm}
.sheet-head .lg{position:absolute;top:0;width:22mm}
.sheet-head .lg.l{left:0}
.sheet-head .lg.r{right:0;width:19mm}
.sheet-head h2{margin:0 0 1mm;font-size:23pt;font-weight:400;letter-spacing:.01em}
.sheet-head p{margin:0;font-family:"Times New Roman",Times,serif;font-style:italic;font-size:10.5pt;line-height:1.32}
.sheet-head .reg{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:10.5pt;margin-top:.5mm}
.marca.off{display:none}
.marca{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:150mm;
  pointer-events:none;z-index:0}
.sheet-body{position:relative;z-index:1;flex:1;padding-top:4mm}

.pfield{display:flex;align-items:baseline;gap:6px;font-size:10.5pt}
.pfield + .pfield{margin-top:2.2mm}
.pfield .k{font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase;color:#595959;
  font-weight:600;white-space:nowrap}
.pfield .v{flex:1;border-bottom:1px dotted #B9B9B9;min-height:1.15em;padding:0 3px}
.pfield .v:empty::before{content:"\00a0"}
.prule{border-bottom:.75pt solid #C4C4C4;margin:3.5mm 0 6mm}

.ex-title{font-size:12pt;font-weight:700;letter-spacing:.045em;text-transform:uppercase;
  border-bottom:1pt solid #3F7A5E;padding-bottom:1.5mm;margin-bottom:5mm}
.lbl{font-size:9pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#595959;margin-bottom:2.5mm}
.blk{font-size:9.5pt;font-weight:700;letter-spacing:.07em;color:#3F7A5E;margin:4mm 0 2mm}
.ln{display:flex;gap:3mm;font-size:11pt;line-height:1.42;margin-bottom:2.4mm}
.ln .n{color:#3F7A5E;font-weight:700;min-width:6mm;flex:none}
.ln.chg .n{color:#2C4A6B}
.obs{font-size:9.5pt;color:#595959;margin-top:4mm}
.impr-out{margin-top:6mm}
.impr-out .ln{margin-bottom:1.6mm}
.ph{background:#FFF3C4;border-radius:2px}

.sheet-foot{position:relative;z-index:1;text-align:center;padding-top:6mm}
.sheet-foot img{width:52mm;display:block;margin:0 auto}
.sheet-foot .fr{border-bottom:.75pt solid #9A9A9A;width:62mm;margin:0 auto 2mm}
.sheet-foot .nm{font-size:10pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sheet-foot .cr{font-size:9pt;color:#595959;letter-spacing:.06em}

/* ───────────── moldes de cabeçalho (seletor "Cabeçalho") ───────────── */
.sheet[data-tm="creb_tatuape"]{--cb:#1B2640}
.sheet[data-tm="creb_tatuape"] .ex-title{border-bottom:0;text-transform:none;letter-spacing:0;
  font-size:12pt;font-weight:700;color:var(--cb);margin-bottom:4mm}
.sheet[data-tm="creb_tatuape"] .blk,.sheet[data-tm="creb_tatuape"] .ln .n,
.sheet[data-tm="creb_tatuape"] .ln.chg .n{color:var(--cb)}
.cb-top{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:2.6mm}
.cb-logo{width:52mm}
.cb-logo img{display:block;width:100%}
.cb-tag{font-size:5.6pt;font-weight:700;color:var(--cb);margin-top:1.4mm;text-transform:uppercase;
  letter-spacing:.15em;white-space:nowrap}
.cb-emi{font-size:10.5pt;font-weight:600;color:#1A1A1A;padding-bottom:1mm}
.cb-rule{border-bottom:.9pt solid #1A1A1A}
.cb-id{font-size:10.5pt;color:#1A1A1A;padding:4.5mm 0 4.5mm}
.cb-row{display:flex;justify-content:space-between;gap:8mm}
.cb-row + .cb-row{margin-top:4.2mm}
.cb-k{font-weight:600}
.cb-id + .cb-rule{margin-bottom:6mm}
.cb-addr{border-top:.9pt solid #1A1A1A;margin-top:5mm;padding-top:2mm;font-size:9pt;color:#1A1A1A;line-height:1.4}
.sheet-foot .cb-addr{text-align:left}

/* ───────────── impressão ───────────── */
@media print{
  @page{size:A4;margin:10mm 16mm}
  body{background:#fff}
  .bar,.console,.paper-bar,.noprint{display:none !important}
  .wrap{display:block;padding:0;max-width:none}
  .paper{position:static}
  .sheet-scale{overflow:visible}
  /* thead/tfoot reais: o timbrado se repete em toda pagina impressa */
  .sheet{width:auto;min-height:0;box-shadow:none;padding:0;transform:none !important;display:block}
  .sheet-tbl{height:auto}
  thead{display:table-header-group}
  tfoot{display:table-footer-group}
  .sheet-head{padding-bottom:3mm}
  .sheet-foot{padding-top:6mm}
  .marca{position:fixed;top:50%;left:50%}
  .marca.off{display:none}
  .ln,.blk,.ex-title,.pfield{break-inside:avoid}
  .ph{background:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><b>Laudo assistido</b><span>Ultrassonografia musculoesquelética</span></div>
  <div class="field"><label for="seg">Segmento</label><select id="seg"></select></div>
  <div class="field" id="wrapMod"><label for="mod">Modelo</label><select id="mod"></select></div>
  <div class="field"><label for="timb">Cabeçalho</label><select id="timb"></select></div>
  <div class="field"><label for="lado">Lado</label><select id="lado"></select></div>
  <div class="field"><label for="pac">Paciente</label><input id="pac" style="min-width:230px" autocomplete="off"></div>
  <div class="field"><label for="dt">Data</label><input id="dt" type="date" style="min-width:150px"></div>
  <div class="field" id="wrapNasc" style="display:none"><label for="nasc">Nascimento</label><input id="nasc" type="date" style="min-width:150px"></div>
  <div class="field"><label for="sol">Médico solicitante</label><input id="sol" style="min-width:190px" autocomplete="off"></div>
  <div class="spacer"></div>
  <div class="act">
    <button class="btn" id="reset" type="button">Tudo normal</button>
    <button class="btn primary" id="imprimir" type="button">Imprimir / PDF</button>
  </div>
</header>

<main class="wrap">
  <section class="console" aria-label="Seleção de achados">
    <div class="console-head">
      <h1 id="ttl">—</h1>
      <div>
        <div class="tally" id="tally"></div>
        <div class="hint">Cada item nasce normal. Desligue “Normal” para liberar os achados do banco.</div>
      </div>
    </div>
    <div id="itens"></div>
    <div id="extras"></div>
    <div class="comp" id="compBox">
      <div class="grouphead" style="padding:0 0 6px;border:0">Comparação com exame anterior</div>
      <div class="fields">
        <span class="slab">exame de</span>
        <input id="compDt" type="date" class="fld wide" style="min-width:140px" aria-label="Data do exame anterior">
        <span class="slab">modalidade</span>
        <input id="compMod" class="fld wide" list="compModLista" placeholder="ex.: USG" aria-label="Modalidade do exame anterior" autocomplete="off">
        <datalist id="compModLista"><option value="USG"><option value="RM"><option value="Radiografia"><option value="TC"></datalist>
      </div>
      <div class="fields" id="compChips"></div>
      <textarea id="compTxt" placeholder="Descrever a evolução em relação ao exame anterior (opcional; não entra no laudo se ficar em branco)."></textarea>
    </div>
    <div class="impr">
      <div class="grouphead" style="padding:0 0 6px;border:0;display:flex;
        justify-content:space-between;align-items:baseline">
        <span>Impressão</span>
        <button class="freebtn" id="btnManual" type="button">editar manualmente</button>
      </div>
      <div class="autonote" id="imprNota"></div>
      <div id="imprAuto"></div>
      <textarea id="imprManual" style="display:none"></textarea>
      <textarea id="imprLivre" placeholder="Acrescentar à conclusão (texto livre)."></textarea>
    </div>
  </section>

  <section class="paper" aria-label="Pré-visualização do laudo">
    <div class="paper-bar"><span>Folha A4 · saída de impressão</span><span id="zoomLbl"></span></div>
    <div class="sheet-scale" id="scaleBox">
      <article class="sheet" id="sheet">
        <img class="marca" id="imgMarca" alt="">
        <table class="sheet-tbl">
          <thead><tr><td><div id="tmHead"></div></td></tr></thead>
          <tfoot><tr><td><div id="tmFoot"></div></td></tr></tfoot>
          <tbody><tr><td>
            <div class="sheet-body">
              <div id="tmIdent"></div>
              <div class="ex-title" id="oTtl"></div>
              <div class="lbl">Relatório</div>
              <div id="oRel"></div>
              <div id="oObs"></div>
              <div class="impr-out" id="oCompBox" style="display:none"><div class="lbl">Comparação</div><div id="oComp"></div></div>
              <div class="impr-out"><div class="lbl">Impressão</div><div id="oImp"></div></div>
            </div>
          </td></tr></tbody>
        </table>
      </article>
    </div>
  </section>
</main>

    if (k % 2 === 0 || on) out += rep;
  });
  return out;
}
/* lacunas do achado: indice estavel, marcando quais pertencem ao trecho de medida */
function campos(base) {
  const out = []; let i = 0;
  base.split(/\[\[(.*?)\]\]/).forEach((p, k) => {
    const med = k % 2 === 1, re = /\.{5}/g; let m;
    while ((m = re.exec(p))) {
      const dep = p.slice(m.index + 5, m.index + 34).replace(/^\s+/, "");
      out.push({ i: i++, med, dica: (dep.split(/[,.;)]/)[0] || "").trim().slice(0, 16) });
    }
  });
  return out;
}
function temMedida(base) { return base.indexOf("[[") >= 0; }

function achado(key) {
  const [gi, ai] = key.split(":").map(Number);
  return seg().grupos[gi].achados[ai];
}
/* tudo o que aparece sob um achado marcado */
function painel(ul, key, base) {
  const s = estado(), li = el("li");
  const bs = barraSlots(key, base); if (bs) li.appendChild(bs);
  const bc = barraCampos(key, base); if (bc) li.appendChild(bc);
  const acao = el("div", "fields");
  if (s.editando[key]) {
    const ta = el("textarea", "edtxt");
    ta.value = txt(chave() + "|f" + key, montar(key, base).replace(/\{\{(\w+)\}\}/g, "....."));
    ta.oninput = () => { setTxt(chave() + "|f" + key, ta.value); render(); };
    li.appendChild(ta);
    const v = el("button", "freebtn", "voltar ao texto padrão"); v.type = "button";
    v.onclick = () => { delete edits[chave() + "|f" + key]; s.editando[key] = false;
      montarConsole(); render(); };
    acao.appendChild(v);
  } else {
    const e = el("button", "freebtn", "editar texto"); e.type = "button";
    e.onclick = () => { s.editando[key] = true; montarConsole(); render(); };
    acao.appendChild(e);
  }
  li.appendChild(acao);
  ul.appendChild(li);
}

/* medidas opcionais + lacunas a preencher */
function barraCampos(key, base) {
  const s = estado(), frag = document.createDocumentFragment();
  s.fill[key] = s.fill[key] || {};
  const cps = campos(base), livres = cps.filter(c => !c.med), meds = cps.filter(c => c.med);
  const input = c => {
    const inp = el("input", "fld" + (c.dica.length > 6 ? " wide" : ""));
    inp.value = s.fill[key][c.i] || ""; inp.placeholder = c.dica || "…";
    inp.title = c.dica; inp.oninput = () => { s.fill[key][c.i] = inp.value; render(); };
    return inp;
  };
  if (temMedida(base)) {
    const linha = el("div", "fields");
    linha.appendChild(el("span", "slab", "medidas"));
    const on = !!s.med[key];
    const ch = el("button", "chip" + (on ? " on" : ""), on ? "incluir medidas ✓" : "incluir medidas");
    ch.type = "button";
    ch.onclick = () => { s.med[key] = !on; montarConsole(); render(); };
    linha.appendChild(ch);
    if (on) meds.forEach(c => { linha.appendChild(input(c));
      if (c.dica) linha.appendChild(el("span", "funit", c.dica)); });
    frag.appendChild(linha);
  }
  if (livres.length) {
    const linha = el("div", "fields");
    linha.appendChild(el("span", "slab", "preencher"));
    livres.forEach(c => { linha.appendChild(input(c));
      if (c.dica) linha.appendChild(el("span", "funit", c.dica)); });
    frag.appendChild(linha);
  }
  return frag.childNodes.length ? frag : null;
}

/* barra de estruturas de um achado marcado */
function barraSlots(key, t) {
  const cs = cats(t);
  if (!cs.length) return null;
  const box = document.createDocumentFragment();
  const st = estado(); st.slots[key] = st.slots[key] || {};
  cs.forEach(c => {
    const cat = CAT[c]; if (!cat) return;
    const linha = el("div", "slots");
    linha.appendChild(el("span", "slab", cat.multi ? "estruturas" : "definir"));
    const sel = st.slots[key][c] = st.slots[key][c] || [];
    cat.opts.forEach(v => {
      const on = sel.includes(v);
      const ch = el("button", "chip" + (cat.multi ? "" : " uni") + (on ? " on" : ""), v);
      ch.type = "button";
      ch.onclick = () => {
        if (cat.multi) {
          const i = sel.indexOf(v); i < 0 ? sel.push(v) : sel.splice(i, 1);
        } else { st.slots[key][c] = on ? [] : [v]; }
        montarConsole(); render();
      };
      linha.appendChild(ch);
    });
    box.appendChild(linha);
  });
  return box;
}

    foot: () => `<div class="sheet-foot">${ASSIN_HTML()}</div>` },
  { id: "creb_tatuape", nome: "CREB Tatuapé", marca: false, nasc: true,
    head: () => `<div class="cb-top">
      <div class="cb-logo"><img src="${LOGO_CREB}" alt="CREB"><div class="cb-tag">Centro de Reumatologia e Ortopedia</div></div>
      <div class="cb-emi">Data de emissão: <span id="oEmi"></span></div></div><div class="cb-rule"></div>`,
    ident: () => `<div class="cb-id">
      <div class="cb-row"><div><span class="cb-k">Paciente:</span> <span id="oPac"></span></div>
        <div><span class="cb-k">Data de nascimento:</span> <span id="oNasc"></span></div></div>
      <div class="cb-row"><div><span class="cb-k">Médico solicitante:</span> <span id="oSol"></span></div></div>
    </div><div class="cb-rule"></div>`,
    foot: () => `<div class="sheet-foot">${ASSIN_HTML()}
      <div class="cb-addr"><div>Rua Apucarana, 1619 – Tatuapé, São Paulo - SP</div>
      <div>Telefone e WhatsApp: (11) 5180-2222</div></div></div>` }
];
let timbAtual = TIMBRADOS[0];
function aplicarTimbrado(id) {
  timbAtual = TIMBRADOS.find(t => t.id === id) || TIMBRADOS[0];
  $("#sheet").dataset.tm = timbAtual.id;
  $("#tmHead").innerHTML = timbAtual.head();
  $("#tmIdent").innerHTML = timbAtual.ident();
  $("#tmFoot").innerHTML = timbAtual.foot();
  imgMarca.classList.toggle("off", !timbAtual.marca);
  $("#wrapNasc").style.display = timbAtual.nasc ? "" : "none";
  timb.value = timbAtual.id;
  try { localStorage.setItem("laudo_timbrado", timbAtual.id); } catch (e) {}   /* só a preferência de cabeçalho; nunca dados de paciente */
  render();
}

/* ─────────── estado ─────────── */
let si = 0, mi = 0;
const store = {};              // "segKey|modIdx" -> estado do modelo
const edits = {};              // texto editado pelo usuário

function seg() { return SEG[si]; }
function mod() { return seg().modelos[mi]; }
function chave() { return seg().key + "|" + mi; }

/* itens do modelo em lista plana, guardando o bloco de origem */
function linhas(m) {
  const out = [];
  if (m.tipo === "itens") m.itens.forEach((it, i) => out.push({ texto: it.texto, bloco: -1, i }));
  else m.blocos.forEach((b, bi) => b.itens.forEach(it =>
    out.push({ texto: it.texto, bloco: bi, i: out.length })));
  return out;
}
/* grupos do banco ligados à linha n (1-based) do modelo em uso */
function ligacoes(gi) {
  const m = mod();
  if (m.tipo === "itens") return seg().grupos[gi].itens || [];
  return ((seg().mapa || {})[String(mi)] || {})[String(gi)] || [];
}
function gruposDoItem(n) {
  return seg().grupos.map((g, gi) => ({ g, gi })).filter(o => ligacoes(o.gi).includes(n));
}
function gruposLivres() {
  return seg().grupos.map((g, gi) => ({ g, gi })).filter(o => !ligacoes(o.gi).length);
}

/* identificação do paciente: vale para todos os segmentos/modelos da sessão (só em memória) */
const ident = { pac: "", dt: "", nasc: "", sol: "" };

function estado() {
  const k = chave();
  if (!store[k]) {
    store[k] = {
      itens: linhas(mod()).map(() => ({ normal: true, sel: [], prev: [], livres: [], aberto: false })),
      slots: {}, med: {}, fill: {}, editando: {},
      extras: [], livresExtra: [],
      imprLivre: "", imprManual: null,
      comp: { dt: "", mod: "", txt: "" },
      lado: seg().fem ? "ESQUERDA" : "ESQUERDO"
    };
  }
  return store[k];
}

/* texto corrente (respeita edição do usuário) */
function txt(path, padrao) { return edits[path] !== undefined ? edits[path] : padrao; }
function setTxt(path, v) { edits[path] = v; }

/* ─────────── barra ─────────── */
function montarBarra() {
  seg_.innerHTML = "";
  let reg = null;
  SEG.forEach((s, i) => {
    if (s.regiao !== reg) { reg = s.regiao;
      const g = el("optgroup"); g.label = reg; g.dataset.reg = reg; seg_.appendChild(g); }
    const o = el("option", null, nomeCurto(s));
    o.value = i; seg_.lastChild.appendChild(o);
  });
  seg_.value = si;
  mod_.innerHTML = "";
  seg().modelos.forEach((m, i) => {
    const o = el("option", null, m.nome || "Modelo padrão"); o.value = i; mod_.appendChild(o);
  });
  mod_.value = mi;
  wrapMod.style.display = seg().modelos.length > 1 ? "" : "none";
  const s = estado();
  lado.innerHTML = "";
  (seg().fem ? ["DIREITA", "ESQUERDA"] : ["DIREITO", "ESQUERDO"]).forEach(v => {
    const o = el("option", null, v); o.value = v; lado.appendChild(o);
  });
  lado.value = s.lado;
  pac.value = ident.pac; dt.value = ident.dt; nasc.value = ident.nasc; sol.value = ident.sol; imprLivre.value = s.imprLivre;
  compDt.value = s.comp.dt; compMod.value = s.comp.mod; compTxt.value = s.comp.txt;
  montarChipsComp();
}
const seg_ = $("#seg"), mod_ = $("#mod");

/* ─────────── console ─────────── */
function montarConsole() {
  const s = estado(), m = mod(), ls = linhas(m);
  ttl.textContent = nomeCurto(seg()) + " " + s.lado;
  itens.innerHTML = ""; extras.innerHTML = "";
  let blocoAtual = -1;

  ls.forEach((ln, i) => {
    if (ln.bloco !== blocoAtual && ln.bloco >= 0) {
      blocoAtual = ln.bloco;
      itens.appendChild(el("div", "grouphead", m.blocos[blocoAtual].titulo));
    }
    const st = s.itens[i], n = i + 1;
    const gs = gruposDoItem(n);
    const row = el("div", "row" + (i % 2 ? " alt" : ""));
    row.classList.toggle("altered", !st.normal);
    row.classList.toggle("pending", !st.normal && !st.sel.length && !st.livres.length);

    row.appendChild(el("div", "idx", m.tipo === "itens"
      ? String(n).padStart(2, "0") : LETRAS[ln.i] + ")"));

    const p = el("p", "sent norm");
    p.contentEditable = "true"; p.spellcheck = false;
    p.textContent = txt(chave() + "|n" + i, ln.texto);
    p.oninput = () => { setTxt(chave() + "|n" + i, p.textContent); render(); };
    row.appendChild(p);

    const lab = el("label", "toggle");
    const cb = el("input"); cb.type = "checkbox"; cb.checked = st.normal;
    cb.onchange = () => {
      if (cb.checked) { st.prev = st.sel.slice(); st.sel = []; }   // trava e guarda
      else { st.sel = st.prev.slice(); }                            // devolve o que havia
      st.normal = cb.checked; montarConsole(); render();
    };
    lab.append(cb, el("span", "track"), el("span", "tlabel", "Normal"));
    row.appendChild(lab);

    const total = gs.reduce((a, o) => a + o.g.achados.length, 0);
    if (gs.length && st.normal && !st.aberto) {
      const pk = el("button", "peek", "ver " + total + " achado" + (total > 1 ? "s" : "") +
        " do banco"); pk.type = "button";
      pk.onclick = () => { st.aberto = true; montarConsole(); };
      row.appendChild(pk);
    } else if (gs.length) {
      const ul = el("ul", "finds" + (st.normal ? " locked" : ""));
      gs.forEach(({ g, gi }) => {
        if (gs.length > 1) ul.appendChild(el("li", "gtitle", g.titulo));
        g.achados.forEach((a, ai) => {
          const key = gi + ":" + ai, on = st.sel.includes(key);
          const li = el("li", "find" + (on ? " on" : ""));
          const c = el("input"); c.type = "checkbox"; c.checked = on; c.disabled = st.normal;
          c.onchange = () => {
            if (c.checked) st.sel.push(key); else st.sel = st.sel.filter(k => k !== key);
            montarConsole(); render();
          };
          const t = el("span", "txt");
          t.appendChild(el("b", null, a.nome + " · "));
          const corrente = txt(chave() + "|f" + key, a.texto);
          t.appendChild(el("span", null,
            montar(key, corrente).replace(/\{\{(\w+)\}\}/g, "…")));
          li.append(c, t); ul.appendChild(li);
          if (on) painel(ul, key, corrente);
        });
      });
      row.appendChild(ul);
      if (st.normal) {
        const nt = el("div", "locknote",
          "Bloqueados enquanto o item estiver normal. ");
        const bt = el("button", "peek", "recolher"); bt.type = "button";
        bt.style.margin = "0"; bt.style.display = "inline";
        bt.onclick = () => { st.aberto = false; montarConsole(); };
        nt.appendChild(bt); row.appendChild(nt);
      }
    }
    if (!st.normal) {
      st.livres.forEach((v, li2) => {
        const ul = el("ul", "finds"), item = el("li", "find on");
        const c = el("input"); c.type = "checkbox"; c.checked = true;
        c.onchange = () => { st.livres.splice(li2, 1); montarConsole(); render(); };
        const t = el("span", "txt"), sp = el("span");
        t.appendChild(el("b", null, "Achado livre · "));
        sp.contentEditable = "true"; sp.spellcheck = false; sp.textContent = v;
        sp.oninput = () => { st.livres[li2] = sp.textContent; render(); };
        t.appendChild(sp); item.append(c, t); ul.appendChild(item); row.appendChild(ul);
      });
      const b = el("button", "freebtn", "+ achado livre"); b.type = "button";
      b.style.gridColumn = "2/-1";
      b.onclick = () => { st.livres.push("Descrever o achado."); montarConsole(); render(); };
      row.appendChild(b);
      if (!st.sel.length && !st.livres.length)
        row.appendChild(el("div", "warn",
          "Item sem achado selecionado — não entra no laudo até você marcar um."));
    }
    itens.appendChild(row);
  });

  /* outros achados */
  const livres = gruposLivres();
  if (livres.length) {
    extras.appendChild(el("div", "grouphead", "Outros achados — entram numerados ao final"));
    const box = el("div", "row"); box.style.gridTemplateColumns = "44px 1fr";
    box.appendChild(el("div", "idx", "++"));
    const ul = el("ul", "finds"); ul.style.gridColumn = "2/-1"; ul.style.marginTop = "0";
    livres.forEach(({ g, gi }) => {
      ul.appendChild(el("li", "gtitle", g.titulo));
      g.achados.forEach((a, ai) => {
        const key = gi + ":" + ai, on = s.extras.includes(key);
        const li = el("li", "find" + (on ? " on" : ""));
        const c = el("input"); c.type = "checkbox"; c.checked = on;
        c.onchange = () => {
          if (c.checked) s.extras.push(key); else s.extras = s.extras.filter(k => k !== key);
          montarConsole(); render();
        };
        const t = el("span", "txt");
        t.appendChild(el("b", null, a.nome + " · "));
        const corr = txt(chave() + "|f" + key, a.texto);
        t.appendChild(el("span", null,
          montar(key, corr).replace(/\{\{(\w+)\}\}/g, "…")));
        li.append(c, t); ul.appendChild(li);
        if (on) painel(ul, key, corr);
      });
    });
    box.appendChild(ul); extras.appendChild(box);
  }

  /* impressão — gerada a partir do que foi marcado */
  const dxs = conclusoes();
  imprAuto.innerHTML = "";
  if (s.imprManual === null) {
    dxs.forEach((t, i) => {
      const d = el("div", "dxline");
      d.append(el("span", "b", (dxs.length > 1 ? (i + 1) + "." : "—")), el("span", null, t));
      imprAuto.appendChild(d);
    });
    imprNota.textContent = s.itens.some(x => !x.normal) || s.extras.length
      ? "Montada automaticamente a partir dos achados marcados."
      : "Nenhuma alteração marcada — conclusão de normalidade.";
    imprAuto.style.display = ""; imprManual.style.display = "none";
    btnManual.textContent = "editar manualmente";
  } else {
    imprAuto.style.display = "none"; imprManual.style.display = "";
    imprManual.value = s.imprManual;
    imprNota.textContent = "Conclusão em modo manual — a geração automática está pausada.";
    btnManual.textContent = "voltar ao automático";
  }

  const alt = s.itens.filter(x => !x.normal).length;
  tally.innerHTML = alt || s.extras.length
    ? "<b>" + (alt + s.extras.length) + "</b> com alteração · " +
      (s.itens.length - alt) + " normais"
    : "Todos os itens normais — sai o modelo padrão";
}

/* conclusões: um diagnóstico por achado marcado, na ordem dos itens */
function conclusoes() {
  const s = estado(), out = [];
  const juntar = key => {
    const a = achado(key), base = montar(key, txt(chave() + "|f" + key, a.texto));
    expandir(key, base).forEach(c => {
      if (!a.dx) return;
      const raiz = c.det.length ? a.dx.split(" — ")[0] : a.dx;
      const linha = c.det.length ? raiz + " — " + c.det.join(", ") : raiz;
      if (!out.includes(linha)) out.push(linha);
    });
  };
  s.itens.forEach(st => {
    if (st.normal) return;
    st.sel.forEach(juntar);
    st.livres.forEach(v => { const t = v.trim(); if (t && !out.includes(t)) out.push(t); });
  });
  s.extras.forEach(juntar);
  if (!out.length) out.push("Estudo ecográfico sem alterações ao método.");
  if (s.imprLivre.trim()) out.push(s.imprLivre.trim());
  return out;
}

/* ─────────── folha ─────────── */
function marcaPh(t) {
  const f = document.createDocumentFragment();
  t.split(/(\.{4,}|_{3,})/).forEach((p, i) =>
    f.appendChild(i % 2 ? el("span", "ph", p) : document.createTextNode(p)));
  return f;
}
function linha(n, t, mudou) {
  const d = el("div", "ln" + (mudou ? " chg" : ""));
  d.appendChild(el("span", "n", n));
  const sp = el("span"); sp.appendChild(marcaPh(t)); d.appendChild(sp);
  return d;
}

function render() {
  const s = estado(), m = mod(), ls = linhas(m);
  const br = v => v ? v.split("-").reverse().join("/") : "";
  [["oPac", ident.pac], ["oDt", br(ident.dt)], ["oEmi", br(ident.dt)], ["oNasc", br(ident.nasc)], ["oSol", ident.sol]]
    .forEach(([i, v]) => { const e = document.getElementById(i); if (e) e.textContent = v; });
  oTtl.textContent = seg().titulo + " " + s.lado;
  oRel.innerHTML = ""; oImp.innerHTML = ""; oObs.innerHTML = "";

  const numerado = m.tipo === "itens";
  let c = 0, blocoAtual = -1;
  const marca = () => numerado ? (++c) + "." : LETRAS[c++] + ")";

  ls.forEach((ln, i) => {
    if (ln.bloco !== blocoAtual && ln.bloco >= 0) {
      blocoAtual = ln.bloco; c = 0;
      oRel.appendChild(el("div", "blk", m.blocos[blocoAtual].titulo));
    }
    const st = s.itens[i];
    if (st.normal) { oRel.appendChild(linha(marca(), txt(chave() + "|n" + i, ln.texto), false)); return; }
    st.sel.forEach(k => expandir(k, montar(k, txt(chave() + "|f" + k, achado(k).texto)))
      .forEach(c => oRel.appendChild(linha(marca(), c.txt, true))));
    st.livres.forEach(v => oRel.appendChild(linha(marca(), v, true)));
  });

  if (s.extras.length) {
    if (!numerado) { oRel.appendChild(el("div", "blk", "ACHADOS ADICIONAIS")); c = 0; }
    s.extras.forEach(k => expandir(k, montar(k, txt(chave() + "|f" + k, achado(k).texto)))
      .forEach(c => oRel.appendChild(linha(marca(), c.txt, true))));
  }

  if (seg().obs) {
    const o = el("div", "obs"); o.append(el("b", null, "Obs.  "), seg().obs); oObs.appendChild(o);
  }
  const tc = textoComparacao();
  oCompBox.style.display = tc.length ? "" : "none"; oComp.innerHTML = "";
  tc.forEach(t => oComp.appendChild(linha("", t, false)));
  const imp = s.imprManual === null ? conclusoes()
            : s.imprManual.split("\n").map(t => t.trim()).filter(Boolean);
  imp.forEach((t, i) => oImp.appendChild(linha(imp.length > 1 ? (i + 1) + "." : "", t, false)));
  ajustarZoom();
}

/* escala da folha para caber na coluna */
function ajustarZoom() {
  const box = $("#scaleBox"), sh = $("#sheet");
  const alvo = box.clientWidth, larg = sh.offsetWidth;
  if (!alvo || !larg) return;
  const z = Math.min(1, alvo / larg);
  sh.style.transform = "scale(" + z + ")";
  box.style.height = sh.offsetHeight * z + "px";
  zoomLbl.textContent = Math.round(z * 100) + "%";
}

/* ─────────── eventos ─────────── */
seg_.onchange = () => { si = +seg_.value; mi = 0; montarBarra(); montarConsole(); render(); };
mod_.onchange = () => { mi = +mod_.value; montarConsole(); render(); };
lado.onchange = () => { estado().lado = lado.value; montarConsole(); render(); };
[["pac", "pac"], ["dt", "dt"], ["nasc", "nasc"], ["sol", "sol"]].forEach(([id, k]) =>
  $("#" + id).oninput = e => { ident[k] = e.target.value; render(); });

/* ─────────── comparação com exame anterior ─────────── */
const FRASES_COMP = [
  ["sem exame anterior", "Não há exame anterior disponível para comparação."],
  ["sem alterações", "Sem alterações significativas em relação ao exame anterior."],
  ["melhora", "Evolução favorável em relação ao exame anterior."],
  ["piora", "Evolução desfavorável em relação ao exame anterior."]
];
function montarChipsComp() {
  compChips.innerHTML = "";
  compChips.appendChild(el("span", "slab", "frase rápida"));
  FRASES_COMP.forEach(([rot, frase]) => {
    const ch = el("button", "chip", rot); ch.type = "button";
    ch.onclick = () => {
      const s = estado(), t = s.comp.txt.trim();
      s.comp.txt = t ? t + " " + frase : frase;
      compTxt.value = s.comp.txt; render();
    };
    compChips.appendChild(ch);
  });
}
/* linha(s) de comparação para a folha; vazio se nada foi preenchido */
function textoComparacao() {
  const c = estado().comp, t = c.txt.trim();
  if (!t) return [];
  const ref = [c.mod.trim(), c.dt ? "de " + c.dt.split("-").reverse().join("/") : ""]
    .filter(Boolean).join(" ");
  return [(ref ? "Exame anterior: " + ref + ". " : "") + t];
}
compDt.oninput = e => { estado().comp.dt = e.target.value; render(); };
compMod.oninput = e => { estado().comp.mod = e.target.value; render(); };
compTxt.oninput = e => { estado().comp.txt = e.target.value; render(); };
imprLivre.oninput = e => { estado().imprLivre = e.target.value; montarConsole(); render(); };
imprManual.oninput = e => { estado().imprManual = e.target.value; render(); };
btnManual.onclick = () => {
  const s = estado();
  s.imprManual = s.imprManual === null ? conclusoes().join("\n") : null;
  montarConsole(); render();
};
$("#reset").onclick = () => {
  const s = estado();
  s.itens.forEach(it => { it.prev = it.sel.slice(); it.sel = []; it.livres = []; it.normal = true; });
  s.extras = []; s.slots = {}; s.med = {}; s.fill = {}; s.editando = {}; s.imprManual = null; montarConsole(); render();
};
$("#imprimir").onclick = () => window.print();
addEventListener("resize", ajustarZoom);

TIMBRADOS.forEach(t => { const o = el("option", null, t.nome); o.value = t.id; timb.appendChild(o); });
timb.onchange = () => aplicarTimbrado(timb.value);
let timbInicial = "particular";
try { timbInicial = localStorage.getItem("laudo_timbrado") || timbInicial; } catch (e) {}
montarBarra(); montarConsole(); aplicarTimbrado(timbInicial);
addEventListener("load", ajustarZoom);
</script>
